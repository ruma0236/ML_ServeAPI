[stages.small]
shard_count = 1

[stages.medium]
shard_count = 2

[stages.large]
shard_count = 4

[execution]
repetitions = 3
single_process_batch_rows = 65536
local_threads = 4
executor_counts = [1, 2, 4]
executor_cores = 1
executor_memory = "768m"
executor_memory_overhead = "384m"
driver_memory = "1024m"
shuffle_partitions = 64
output_partitions = 32
adaptive_enabled = true
skew_fraction_percent = 70
retry_generated_io_factor = 4
retry_partition_hold_ms = 1500
spark_image_repository = "enterprise-vision-mlops-spark"
namespace = "evm-pipelines"
service_account = "evm-spark"
pvc_name = "evm-large-data"

[guardrails]
minimum_free_disk_bytes = 107374182400
maximum_run_seconds = 900
maximum_executor_peak_memory_bytes = 1342177280
maximum_gc_ratio = 0.50
maximum_skew_ratio = 400.0
require_zero_missing = true
require_zero_duplicates = true
require_zero_uncommitted_outputs = true

[paths]
private_relative_root = "artifacts/scale_validation/private/s5"
spark_event_log_relative_root = "artifacts/scale_validation/private/s5-event-logs"
output_relative_root = "artifacts/scale_validation/private/s5-outputs"

[claim]
boundary = "Measured Criteo click-log columnar and Spark executor behavior on one local physical node. No customer traffic, production SLA, physical multi-node or multi-zone HA, stateful HA/DR, full-terabyte processing, or new semantic-diversity claim."
