[profile]
version = "s2-bounded-queue-v2-cpu1-control-20260816"
status = "frozen-before-experiment"

[durable_queue]
max_depth = 64
max_bytes = 393216
max_item_bytes = 262144
ingress_max_body_bytes = 262144
max_age_seconds = 120.0
admission_wait_seconds = 0.25
retry_after_seconds = 2

[local_queue]
max_depth = 8
max_bytes = 262144

[worker]
work_timeout_seconds = 10.0
cpu_workers_min = 1
cpu_workers_max = 1
gpu_workers = 1
lease_seconds = 6.0
lease_renew_interval_seconds = 2.0
poll_interval_seconds = 0.1
runtime_poll_interval_seconds = 0.25
runtime_terminal_timeout_seconds = 120.0
drain_timeout_seconds = 60.0
metrics_port = 9465

[retry]
max_attempts = 3
backoff_base_seconds = 0.25
backoff_max_seconds = 2.0
jitter_ratio = 0.20
global_budget = 32
budget_window_seconds = 60.0
budget_scope = "s2-bounded-queue-v2-cpu1-control"

[resource_limits]
rss_cap_bytes = 1073741824
rss_slope_tolerance_bytes_per_minute = 16777216

[retention]
terminal_queue_max_rows = 64
terminal_queue_max_age_seconds = 600.0
task_history_max_terminal_rows = 64
compaction_batch_size = 64
