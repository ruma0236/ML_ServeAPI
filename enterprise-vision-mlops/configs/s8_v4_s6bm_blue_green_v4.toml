model_version = "1"
artifact_sha256 = "194a45c3f82d95ef3a21da16f533ba959fd1c76afa9088a6a795256c50fd2146"
config_sha256 = "b3b33e38e4bd6ae82a8f2dbbc53a9dd1ef1db54be679615eca1352858e003499"
