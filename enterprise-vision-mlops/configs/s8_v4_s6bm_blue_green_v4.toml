[procedure]
baseline_repetitions = 3
successful_transition_repetitions = 3
wrong_digest_repetitions = 3
negative_profile_repetitions = 3
logical_requests_per_transition = 1000
baseline_requests = 250
canary_requests = 100
warmup_requests = 20
request_concurrency = 16
long_in_flight_hold_ms = 1200
readiness_timeout_seconds = 30
drain_timeout_seconds = 15
cleanup_timeout_seconds = 120
vram_headroom_mib = 512
max_transition_p99_ms = 250.0
max_inter_completion_gap_ms = 2500.0
max_transition_5xx = 0
canary_weight_percent = 10

[clock]
contract = "independent_dual_clock_anchor_chain_v3"
max_anchor_width_ns = 1000000
max_anchor_gap_seconds = 30
max_offset_spread_ns = 2000000
max_phase_interval_ns = 250000000
affine_model = "centered_ols_fraction_all_points_v1"
affine_max_drift_ppm = 100
affine_max_residual_ns = 1000000
affine_max_step_ns = 2000000
affine_required_outlier_count = 0
affine_projection_uncertainty = "ceil_max_abs_residual_plus_ceil_anchor_half_width_plus_1ns"
per_request_offset_forbidden = true
overlapping_causal_intervals_fail = true
source_identity_required = true
independent_nonce_anchor_required = true
adjudicated_request_anchor_forbidden = true
required_phase_anchors = ["blue_only", "green_active", "blue_draining", "green_only", "blue_active_rollback", "rolled_back"]

[causal_fence]
contract = "existing_transactional_store_causal_sequence_v2"
event_table = "s6bm_causal_events"
sequence_kind = "postgresql_bigserial"
crossover_request_selection = "predetermined_blue_hold_request_before_dispatch"
required_start_receipts = ["api_server_handler_entry", "controller_entry", "triton_backend_compute_entry"]
receipt_commit_readback_required = true
receipt_identity_fields = ["attempt_id", "run_id", "request_id", "request_nonce", "trace_id", "effect_id", "model_role", "model_name", "model_version", "artifact_sha256", "route_generation", "actor_identity"]
route_switch_requires_all_start_receipts = true
route_switch_event = "blue_to_green_switch_commit"
stale_blue_admission_forbidden = true
terminal_effect_event = "durable_terminal_effect_commit"
unload_intent_event = "blue_unload_intent"
unload_requires_all_pre_switch_blue_terminal_effects = true
same_transaction_effect_event_and_sequence = true
same_transaction_entity_idempotency_effect_event_and_sequence = true
exact_commit_instant_claimed = false

[triton_actor_receipt]
contract = "official_triton_timestamp_trace_collector_v2"
required_activity = "COMPUTE_START"
raw_trace_required = true
request_nonce_binding_required = true
model_version_artifact_binding_required = true
collector_commit_readback_required = true
missing_or_ambiguous_trace_fails = true
registration_actor = "dedicated_collector_process"
runner_synthesized_receipt_forbidden = true

[durable_effect]
contract = "existing_control_plane_entities_idempotency_causal_v3"
synchronous_commit = "on"
commit_readback_required = true
commit_timestamp_tracking_required = true
commit_timestamp_separate_connection_required = true
database_clock_anchor_required = true
database_clock_anchor_contract = "separate_connection_postgresql_clock_timestamp_nonce_v1"
database_clock_anchor_samples = 8
database_clock_anchor_selection = "minimum_width_then_sequence"
database_clock_anchor_candidates_required = true
database_clock_anchor_sequence = [1, 2, 3, 4, 5, 6, 7, 8]
database_clock_anchor_nonce_derivation = "uuid4_hex_immediately_before_each_sequence"
database_clock_anchor_selection_inputs = ["bracket_width_ns", "sequence"]
database_clock_anchor_max_selected_width_ns = 5000000
commit_timestamp_readback_lane = "bounded_parallel_post_commit_v1"
commit_timestamp_readback_max_concurrency = 2
commit_timestamp_readback_acquire_timeout_seconds = 2.0
write_pool_size_change_forbidden = true
whole_request_serialization_forbidden = true
entity_kind = "s6bm_terminal_effect"
scope_prefix = "s6bm.terminal-effect"
same_transaction_causal_receipt = true
schema_prefix = "evm_s6bm_v4"
pool_min_size = 1
pool_max_size = 8
acquire_timeout_seconds = 2.0
lock_timeout_seconds = 2.0
statement_timeout_seconds = 10.0

[trace]
contract = "w3c_parent_chain_to_triton_backend_v1"
required_chain = ["api_server", "controller", "triton_client", "triton_infer_request", "triton_model", "triton_compute", "durable_effect"]
exact_parent_span_required = true
request_trace_effect_model_generation_backend_join_required = true

[run_set]
contract = "exact_frozen_matrix_set_v1"
baseline = [1, 2, 3]
successful_transition = [1, 2, 3]
wrong_digest = [1, 2, 3]
green_load_failure = [1, 2, 3]
green_readiness_failure = [1, 2, 3]
green_canary_failure = [1, 2, 3]
vram_preflight_rejection = [1, 2, 3]

[continuity]
contract = "fixed_exact_1000_blue_continuity_v1"
logical_request_count = 1000
canary_count = 100
causal_hold_count = 1
bridge_count = 40
normal_count = 859
cadence_ms = 150
producer_workers = 4
max_in_flight_requests = 4
max_request_payload_bytes = 4096
max_in_flight_payload_bytes = 16384
bridge_hold_count = 4
bridge_hold_ms = 400
required_actor_bridge_count = 4
crossover_bridge_count = 1
required_actor_bridge_selection = "prefix"
held_bridge_selection = "suffix"
crossover_bridge_selection = "first_required"
pending_crossover_count = 2
pre_switch_terminal_bridge_count = 39
route_switch_barrier_mode = "exact_one_after_39_blue_terminal"
route_switch_barrier_timeout_seconds = 15
max_schedule_lateness_ms = 500
minimum_blue_in_flight_at_switch = 2
minimum_bridge_cross_switch_completions = 1
minimum_transition_terminal_completions = 8
adaptive_pacing_forbidden = true
post_hoc_windowing_forbidden = true
schedule_hash_algorithm = "sha256_canonical_json"

[ports]
triton_http = 18100
triton_grpc = 18101
triton_metrics = 18102
api = 18110

[telemetry]
prometheus_job_triton = "evm-s8-v4-s6bm-triton"
prometheus_job_api = "evm-s8-v4-s6bm-api"
prometheus_scrape_seconds = 1

[claim_boundary]
scope = "one Windows/WSL2 physical node, one RTX 4080, one Triton GPU container, one local PostgreSQL control-plane instance, controlled traffic"
excluded = ["production SLA", "database HA/DR durability", "physical HA", "node failover", "multi-node", "multi-GPU", "MIG", "MPS", "zero-interruption guarantee", "exact cross-host event instant without a bounded causal interval"]
