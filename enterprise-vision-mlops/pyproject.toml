[project]
name = "enterprise-vision-mlops"
version = "0.1.0"
description = "Portfolio-grade modular MLOps platform for enterprise vision AI workloads."
requires-python = ">=3.11"
dependencies = [
    "boto3==1.35.76",
    "cryptography==49.0.0",
    "fastapi==0.115.6",
    "optuna==4.9.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pillow==12.2.0",
    "prometheus-client==0.21.1",
    "psutil==7.2.2",
    "psycopg[binary]==3.2.4",
    "psycopg-pool==3.2.4",
    "pydantic==2.10.3",
    "pyarrow==18.1.0",
    "requests==2.32.3",
    "scikit-learn==1.5.2",
    "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
