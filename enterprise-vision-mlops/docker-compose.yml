services:
  postgres:
    image: postgres:16-alpine
    container_name: evm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mlops-local

  airflow-postgres:
    image: postgres:16-alpine
    container_name: evm-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mlops-local

  airflow-init:
    build:
      context: .
      dockerfile: infra/docker/airflow/Dockerfile
    image: enterprise-vision-mlops-airflow:local
    container_name: evm-airflow-init
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-evm-airflow-local-secret}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      EVM_PROJECT_ROOT: /opt/airflow/evm_project
      EVM_PIPELINE_CONFIG: /opt/airflow/evm_project/configs/airflow.toml
      EVM_GIT_COMMIT: ${EVM_GIT_COMMIT:-}
      EVM_GIT_BRANCH: ${EVM_GIT_BRANCH:-}
      EVM_HOST_DATA_ROOT: ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}
      EVM_DATA_MOUNT_ROOT: /mnt/evm-data
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: /opt/airflow/evm_project/src
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags:ro
      - ./:/opt/airflow/evm_project
      - ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}:/mnt/evm-data
      - airflow-logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username $${AIRFLOW_ADMIN_USERNAME} --password $${AIRFLOW_ADMIN_PASSWORD} --firstname Enterprise --lastname MLOps --role Admin --email $${AIRFLOW_ADMIN_EMAIL} || true
      "
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - mlops-local

  airflow-webserver:
    build:
      context: .
      dockerfile: infra/docker/airflow/Dockerfile
    image: enterprise-vision-mlops-airflow:local
    container_name: evm-airflow-webserver
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-evm-airflow-local-secret}
      EVM_PROJECT_ROOT: /opt/airflow/evm_project
      EVM_PIPELINE_CONFIG: /opt/airflow/evm_project/configs/airflow.toml
      EVM_GIT_COMMIT: ${EVM_GIT_COMMIT:-}
      EVM_GIT_BRANCH: ${EVM_GIT_BRANCH:-}
      EVM_HOST_DATA_ROOT: ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}
      EVM_DATA_MOUNT_ROOT: /mnt/evm-data
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: /opt/airflow/evm_project/src
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags:ro
      - ./:/opt/airflow/evm_project
      - ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}:/mnt/evm-data
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - mlops-local

  airflow-scheduler:
    build:
      context: .
      dockerfile: infra/docker/airflow/Dockerfile
    image: enterprise-vision-mlops-airflow:local
    container_name: evm-airflow-scheduler
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-evm-airflow-local-secret}
      EVM_PROJECT_ROOT: /opt/airflow/evm_project
      EVM_PIPELINE_CONFIG: /opt/airflow/evm_project/configs/airflow.toml
      EVM_GIT_COMMIT: ${EVM_GIT_COMMIT:-}
      EVM_GIT_BRANCH: ${EVM_GIT_BRANCH:-}
      EVM_HOST_DATA_ROOT: ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}
      EVM_DATA_MOUNT_ROOT: /mnt/evm-data
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: /opt/airflow/evm_project/src
    command: scheduler
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags:ro
      - ./:/opt/airflow/evm_project
      - ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}:/mnt/evm-data
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - mlops-local

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: evm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${EVM_HOST_MINIO_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops/minio}:/data
    networks:
      - mlops-local

  minio-create-buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: evm-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow-artifacts}
      RAW_BUCKET: ${RAW_BUCKET:-raw}
      PROCESSED_BUCKET: ${PROCESSED_BUCKET:-processed}
      VALIDATED_BUCKET: ${VALIDATED_BUCKET:-validated}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      for bucket in $${MLFLOW_BUCKET} $${RAW_BUCKET} $${PROCESSED_BUCKET} $${VALIDATED_BUCKET}; do
        mc mb -p local/$${bucket};
        mc anonymous set none local/$${bucket};
      done;
      exit 0;
      "
    networks:
      - mlops-local

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/mlflow/Dockerfile
    container_name: evm-mlflow
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow-artifacts}
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --serve-artifacts
      - --artifacts-destination
      - s3://${MLFLOW_BUCKET:-mlflow-artifacts}
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - mlops-local

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: evm-api
    environment:
      APP_NAME: enterprise-vision-mlops-api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: vision-baseline
      MODEL_STAGE: Production
      MODEL_REGISTRY_PATH: /app/artifacts/registry/vision-baseline/latest.json
      EVM_CONTROL_PANEL_CONFIG: configs/airflow.toml
      VLM_OBSERVABILITY_PATH: /app/artifacts/vlm/visa/observability/benchmark_report.json
      EVM_HOST_DATA_ROOT: ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}
      EVM_DATA_MOUNT_ROOT: /mnt/evm-data
      EVM_TARGET_ENVIRONMENT: staging
      EVM_TARGET_NAMESPACE: evm-staging
      EVM_PROMOTION_REQUESTER: ml-platform
      EVM_PROMOTION_POLICY_PERSIST: "true"
      EVM_PROMOTION_POLICY_EVIDENCE_ROOT: /app/artifacts/w7/promotion_policy
      EVM_CONTROL_PANEL_LEDGER_ROOT: /app/artifacts/w7/operations
      EVM_CI_EVIDENCE_PATH: /app/artifacts/w7/ci/latest_ci_evidence.json
      EVM_CI_VALIDATION_REPORT_PATH: /app/artifacts/w7/ci/latest_ci_validation.json
      EVM_EXPECTED_CI_COMMIT: ${EVM_EXPECTED_CI_COMMIT:-}
      GIT_COMMIT: ${EVM_GIT_COMMIT:-}
      GIT_BRANCH: ${EVM_GIT_BRANCH:-}
      EVM_DEPLOYMENT_INTENT_ROOT: /app/artifacts/w7/deployment_intents
      EVM_CONTROL_PANEL_CACHE_TTL_SECONDS: "2"
      EVM_KUBERNETES_RESOURCE_SNAPSHOT_PATH: /app/artifacts/w7/kubernetes_observer/latest.json
      EVM_KUBERNETES_SNAPSHOT_STALE_SECONDS: "15"
    ports:
      - "8000:8000"
    volumes:
      - ${EVM_HOST_ARTIFACTS_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops/artifacts}:/app/artifacts:ro
      - ${EVM_HOST_ARTIFACTS_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops/artifacts}/w7:/app/artifacts/w7
      - ${EVM_HOST_DATA_ROOT:-F:/EnterpriseMLOps_Data/enterprise-vision-mlops}:/mnt/evm-data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mlops-local

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: evm-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mlops-local

  grafana:
    image: grafana/grafana:11.3.1
    container_name: evm-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mlops-local

networks:
  mlops-local:
    name: evm-local

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  airflow-logs:
  airflow-postgres-data:
