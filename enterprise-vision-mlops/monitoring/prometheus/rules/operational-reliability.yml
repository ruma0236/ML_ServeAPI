groups:
  - name: evm-operational-reliability
    interval: 15s
    rules:
      - alert: EVMOperationalGPUAllocatableLost
        expr: evm_operational_target_health{scenario="A",target="production-b0",signal="gpu_allocatable"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Exact production B0 target lost allocatable GPU capacity
      - alert: EVMOperationalDevicePluginUnavailable
        expr: evm_operational_target_health{scenario="A",target="production-b0",signal="device_plugin"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Exact production B0 device-plugin signal is unhealthy
      - alert: EVMOperationalServingTargetDown
        expr: evm_operational_target_health{scenario="A",target="production-b0",signal="prometheus"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Exact production B0 Prometheus target is down
      - alert: EVMOperationalIdentityMismatch
        expr: evm_operational_target_health{scenario="A",target="production-b0",signal="identity"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: Production B0 serving identity differs from the approved subset
      - alert: EVMOperationalRecoveryBudgetExceeded
        expr: evm_operational_recovery_seconds{scenario="A",target="production-b0"} > 300
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: Scenario A local recovery exceeded the 300 second engineering target
      - alert: EVMHostRuntimeSupervisorUnhealthy
        expr: evm_control_panel_runtime_supervisor_healthy == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: Local lifecycle host supervisor is stale, unavailable, or degraded
      - alert: EVMHostRuntimeChildNotLive
        expr: evm_control_panel_runtime_child_state{state=~"suspect|recovering|backoff|blocked|circuit_open"} == 1
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: A supervised lifecycle host child is not live
      - alert: EVMHostRuntimeHeartbeatStale
        expr: evm_control_panel_runtime_child_heartbeat_age_seconds > 20
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: A lifecycle worker or observer heartbeat exceeded the stale threshold
      - alert: EVMHostRuntimeRevisionMismatch
        expr: evm_control_panel_runtime_child_revision_match == 0
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: A supervised child is not running the supervisor source revision
      - alert: EVMHostRuntimeProcessCountInvalid
        expr: evm_control_panel_runtime_child_process_count != 1
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: A supervised child has zero or multiple command-matched processes
      - alert: EVMDataArtifactIntegrityBlocked
        expr: evm_operational_validation_total{scenario="E",result=~"blocked|failed"} == 1 or evm_operational_target_health{scenario="E",target="data-artifact",signal="artifact_integrity"} == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: Scenario E data or artifact integrity admission is blocked
