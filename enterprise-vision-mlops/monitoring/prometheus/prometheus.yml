global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "evm-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "evm-task-queue-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["task-queue-worker:9465"]

  - job_name: "evm-s6-api"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/s6-api.json
        refresh_interval: 2s

  - job_name: "evm-s7-family"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/s7-family.json
        refresh_interval: 2s

  - job_name: "evm-b0-production"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/b0-production.json
        refresh_interval: 5s

  - job_name: "evm-lifecycle-serving"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/lifecycle-serving.json
        refresh_interval: 5s

  - job_name: "evm-otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
