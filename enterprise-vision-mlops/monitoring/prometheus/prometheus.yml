global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "evm-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "evm-b0-production"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:30800"]

  - job_name: "evm-lifecycle-serving"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
