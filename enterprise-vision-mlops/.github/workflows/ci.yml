name: Enterprise Vision MLOps CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3==1.35.76 pyarrow==18.1.0

      - name: Compile Python modules
        run: |
          python -m compileall src scripts apps/api orchestration/airflow/dags

      - name: Pipeline CLI smoke
        run: |
          python scripts/run_pipeline.py --help

      - name: Docker Compose config smoke
        run: |
          docker compose config --quiet

      - name: Docker image build smoke
        run: |
          docker compose build api mlflow

      - name: Minimal pipeline smoke
        run: |
          python scripts/run_pipeline.py dataset-intake-audit --config configs/local.toml
          python scripts/run_pipeline.py domain-pack-check --config configs/local.toml

      - name: W4 command import smoke
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "evm.pipelines.dataset_intake_audit.run",
              "evm.pipelines.image_quality.run",
              "evm.pipelines.dataset_shards.run",
              "evm.pipelines.vlm_contract.run",
              "evm.pipelines.vlm_batch_eval.run",
              "evm.pipelines.vlm_reliability.run",
              "evm.pipelines.vlm_rca.run",
              "evm.pipelines.vlm_observability.run",
          ]
          for module in modules:
              importlib.import_module(module)
          print("w4_import_smoke_ok")
          PY
