<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172026}.title{font-size:22px;font-weight:700}.label{font-size:13px}.small{font-size:11px}.value{font-size:18px;font-weight:700}</style>
<text x="32" y="42" class="title">W5 Local and Remote Resource Topology</text>
<rect x="40" y="100" width="260" height="170" rx="8" fill="#dbeafe" stroke="#334155"/>
<text x="58" y="132" class="value">Windows primary node</text>
<text x="58" y="166" class="label">Role: train, registry, serving</text>
<text x="58" y="190" class="label">CPU threads: 24</text>
<text x="58" y="214" class="label">GPU: NVIDIA GeForce RTX 4080 SUPER</text>
<text x="58" y="238" class="label">Data/artifacts: F: drive</text>
<rect x="360" y="100" width="260" height="170" rx="8" fill="#dcfce7" stroke="#334155"/>
<text x="378" y="132" class="value">Docker MLOps stack</text>
<text x="378" y="166" class="label">Airflow, MLflow, API</text>
<text x="378" y="190" class="label">MinIO, Prometheus, Grafana</text>
<text x="378" y="214" class="label">Data mount: /mnt/evm-data</text>
<text x="378" y="238" class="label">Registry mount: /app/artifacts</text>
<rect x="680" y="100" width="260" height="170" rx="8" fill="#fef3c7" stroke="#334155"/>
<text x="698" y="132" class="value">Mac mini M4 Pro</text>
<text x="698" y="166" class="label">Role: ARM64 remote evaluator</text>
