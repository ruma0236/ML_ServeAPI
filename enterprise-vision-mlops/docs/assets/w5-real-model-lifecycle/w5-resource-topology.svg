<text x="698" y="238" class="label">Memory bytes: 25769803776</text>
<path d="M300 185 L360 185" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M620 185 L680 185" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#334155"/></marker></defs>
<text x="40" y="335" class="label">Resource policy: CPU feature model is trained locally; GPU availability is captured for deep/VLM workloads; Mac mini validates ARM64 execution and remote artifact collection.</text>
