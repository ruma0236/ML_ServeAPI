apiVersion: v1
kind: ServiceAccount
metadata:
  name: evm-spark
  namespace: evm-pipelines
  labels:
    app.kubernetes.io/part-of: enterprise-vision-mlops
    evm.openai.local/scenario: s5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evm-spark-driver
  namespace: evm-pipelines
  labels:
    app.kubernetes.io/part-of: enterprise-vision-mlops
    evm.openai.local/scenario: s5
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evm-spark-driver
  namespace: evm-pipelines
  labels:
    app.kubernetes.io/part-of: enterprise-vision-mlops
    evm.openai.local/scenario: s5
subjects:
  - kind: ServiceAccount
    name: evm-spark
    namespace: evm-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evm-spark-driver
