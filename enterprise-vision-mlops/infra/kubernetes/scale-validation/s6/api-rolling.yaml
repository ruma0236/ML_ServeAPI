apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-s6-api
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-s6-api
    app.kubernetes.io/part-of: enterprise-vision-mlops
    evm.openai.local/scenario: s6
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-s6-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-s6-api
        app.kubernetes.io/part-of: enterprise-vision-mlops
        evm.openai.local/scenario: s6
        evm.openai.local/release: bootstrap
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: enterprise-vision-mlops-api:s6-bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: enterprise-vision-mlops-api-s6
            - name: EVM_API_RELEASE_ID
              value: bootstrap
            - name: EVM_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: EVM_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GIT_COMMIT
              value: S6_SOURCE_REVISION
            - name: GIT_BRANCH
              value: codex/distributed-scale-validation-plan
            - name: EVM_CONTROL_PLANE_STORE_MODE
              value: postgres
            - name: EVM_CONTROL_PLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evm-s6-control-plane
                  key: database-url
            - name: EVM_CONTROL_PLANE_DATABASE_SCHEMA
              value: evm_s6_api
            - name: EVM_CONTROL_PLANE_POOL_MIN_SIZE
              value: "1"
            - name: EVM_CONTROL_PLANE_POOL_MAX_SIZE
              value: "4"
            - name: EVM_CONTROL_PLANE_POOL_ACQUIRE_TIMEOUT_SECONDS
              value: "2"
            - name: EVM_CONTROL_PLANE_LOCK_TIMEOUT_SECONDS
              value: "2"
            - name: EVM_CONTROL_PLANE_STATEMENT_TIMEOUT_SECONDS
              value: "10"
            - name: EVM_CONTROL_PLANE_AUTO_MIGRATE
              value: "true"
            - name: EVM_TASK_ADMISSION_MODE
              value: legacy
            - name: EVM_TASK_QUEUE_CONFIG
              value: configs/s2_bounded_queue_v1.toml
            - name: EVM_CONTROL_PANEL_LEDGER_ROOT
              value: /app/runtime/w7/operations
            - name: EVM_LIFECYCLE_RUN_ROOT
              value: /app/runtime/w7/lifecycle_runs
            - name: EVM_LIFECYCLE_RUNTIME_ROOT
              value: /app/runtime/w7/lifecycle_runs
            - name: EVM_DEPLOYMENT_INTENT_ROOT
              value: /app/runtime/w7/deployment_intents
            - name: EVM_EXPERIMENT_RUN_ROOT
              value: /app/runtime/w8/experiment_runs
            - name: EVM_MODEL_COMPONENT_REGISTRY_ROOT
              value: /app/runtime/w8/model_components
            - name: EVM_DATA_MOUNT_ROOT
              value: /mnt/evm-data
            - name: MODEL_NAME
              value: vision-baseline
            - name: MODEL_STAGE
              value: Shadow
            - name: MODEL_REGISTRY_PATH
              value: /mnt/evm-data/artifacts/registry/vision-baseline/latest.json
            - name: MLFLOW_TRACKING_URI
              value: http://host.docker.internal:5000
            - name: EVM_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://host.docker.internal:4318/v1/traces
            - name: OTEL_SERVICE_NAMESPACE
              value: enterprise-mlops
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - python
                  - -m
                  - evm.control_panel.api_rollout
                  - --timeout-seconds
                  - "20"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: large-data
              mountPath: /mnt/evm-data
              readOnly: true
            - name: runtime
              mountPath: /app/runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: large-data
          persistentVolumeClaim:
            claimName: evm-large-data
            readOnly: true
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evm-s6-api
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-s6-api
    app.kubernetes.io/part-of: enterprise-vision-mlops
    evm.openai.local/scenario: s6
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: evm-s6-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 31060
