apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-api
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-api
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-api
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: enterprise-vision-mlops-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: enterprise-vision-mlops-api
            - name: EVM_API_RELEASE_ID
              value: local
            - name: EVM_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          envFrom:
            - configMapRef:
                name: evm-runtime-config
          volumeMounts:
            - name: large-data
              mountPath: /mnt/evm-data
              readOnly: true
            - name: large-data
              mountPath: /app/artifacts
              subPath: artifacts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - python
                  - -m
                  - evm.control_panel.api_rollout
                  - --timeout-seconds
                  - "20"
      volumes:
        - name: large-data
          persistentVolumeClaim:
            claimName: evm-large-data
---
apiVersion: v1
kind: Service
metadata:
  name: evm-api
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-api
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  selector:
    app.kubernetes.io/name: evm-api
  ports:
    - name: http
      port: 8000
      targetPort: http
