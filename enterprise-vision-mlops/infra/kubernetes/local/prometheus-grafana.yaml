apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-prometheus
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-prometheus
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-prometheus
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: evm-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: evm-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: evm-prometheus
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-prometheus
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  selector:
    app.kubernetes.io/name: evm-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-grafana
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-grafana
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-grafana
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: evm-grafana-secret
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evm-grafana-secret
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: provisioning
          configMap:
            name: evm-grafana-provisioning
        - name: data
          persistentVolumeClaim:
            claimName: evm-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: evm-grafana
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-grafana
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  selector:
    app.kubernetes.io/name: evm-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
