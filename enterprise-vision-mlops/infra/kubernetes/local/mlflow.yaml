apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-mlflow
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-mlflow
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-mlflow
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      containers:
        - name: mlflow
          image: enterprise-vision-mlops-mlflow:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: evm-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evm-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: evm-postgres-secret
                  key: POSTGRES_DB
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: evm-minio-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: evm-minio-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: evm-runtime-config
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: MLFLOW_BUCKET
              value: mlflow-artifacts
          command: ["mlflow"]
          args:
            - server
            - --backend-store-uri
            - postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@evm-postgres:5432/$(POSTGRES_DB)
            - --serve-artifacts
            - --artifacts-destination
            - s3://mlflow-artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: evm-mlflow
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-mlflow
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  selector:
    app.kubernetes.io/name: evm-mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
