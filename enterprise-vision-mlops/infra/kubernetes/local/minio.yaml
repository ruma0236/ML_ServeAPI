apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evm-minio
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-minio
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  serviceName: evm-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-minio
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - secretRef:
                name: evm-minio-secret
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: evm-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: evm-minio
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-minio
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  selector:
    app.kubernetes.io/name: evm-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: evm-minio-create-buckets
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-minio-create-buckets
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-minio-create-buckets
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          envFrom:
            - secretRef:
                name: evm-minio-secret
          env:
            - name: MLFLOW_BUCKET
              value: mlflow-artifacts
            - name: RAW_BUCKET
              value: raw
            - name: PROCESSED_BUCKET
              value: processed
            - name: VALIDATED_BUCKET
              value: validated
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://evm-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO"
                sleep 2
              done
              for bucket in "$MLFLOW_BUCKET" "$RAW_BUCKET" "$PROCESSED_BUCKET" "$VALIDATED_BUCKET"; do
                mc mb -p "local/$bucket" || true
                mc anonymous set none "local/$bucket"
              done
