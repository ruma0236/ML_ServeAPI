apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: evm-postgres
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-postgres
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  serviceName: evm-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-postgres
        app.kubernetes.io/part-of: enterprise-vision-mlops
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: evm-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: evm-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: evm-postgres
  namespace: evm-platform
  labels:
    app.kubernetes.io/name: evm-postgres
    app.kubernetes.io/part-of: enterprise-vision-mlops
spec:
  selector:
    app.kubernetes.io/name: evm-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
