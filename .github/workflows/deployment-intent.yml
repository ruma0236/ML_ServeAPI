name: Enterprise Vision Deployment Admission

on:
  workflow_run:
    workflows:
      - Enterprise Vision MLOps CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  validate-ci-admission:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-vision-mlops
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment admission runtime
        run: python -m pip install -e .

      - name: Download originating CI evidence
        uses: actions/download-artifact@v4
        with:
          name: evm-ci-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: enterprise-vision-mlops/artifacts/w7/ci

      - name: Validate CI evidence before local intent admission
        run: |
          python -m evm.control_panel.deployment_intents validate-ci \
            --input artifacts/w7/ci/latest_ci_evidence.json \
            --expected-commit "${{ github.event.workflow_run.head_sha }}" \
            --output artifacts/w7/ci/deployment_admission_validation.json \
            --require-valid

      - name: Publish CI admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: evm-deployment-admission-${{ github.event.workflow_run.id }}
          path: enterprise-vision-mlops/artifacts/w7/ci/deployment_admission_validation.json
          if-no-files-found: error
          retention-days: 30

  reject-failed-ci:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block deployment intent admission
        run: |
          echo "Deployment intent admission blocked."
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          exit 1
